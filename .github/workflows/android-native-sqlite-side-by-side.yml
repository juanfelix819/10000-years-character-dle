name: Build Android APK - side by side install

on:
  workflow_dispatch:
  push:
    branches: [ "android-native-sqlite-build" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -name '*Native*SQLite*AndroidStudio*.zip' -print -quit)"
          test -n "$ZIP"
          rm -rf /tmp/android-src
          mkdir -p /tmp/android-src
          unzip -q "$ZIP" -d /tmp/android-src
          DIR="$(find /tmp/android-src -maxdepth 3 -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project: $DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Gradle
        shell: bash
        run: |
          set -euo pipefail
          command -v gradle
          gradle --version

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle wrapper --gradle-version 8.11 --distribution-type bin

      - name: Make package unique for side-by-side installation
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/build.gradle.kts"
          test -f "$FILE"
          sed -i 's/applicationId[[:space:]]*=[[:space:]]*"[^"]*"/applicationId = "com.playerfrom10000years.native"/' "$FILE"
          sed -i 's/versionCode[[:space:]]*=[[:space:]]*[0-9][0-9]*/versionCode = 2/' "$FILE" || true
          grep -nE 'applicationId|versionCode' "$FILE" || true

      - name: Align Java and Kotlin JVM targets
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
          s = s.replace('jvmTarget = "11"', 'jvmTarget = "17"')
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p /tmp/apk-out
          cp "$APK" /tmp/apk-out/player-from-10000-years-native-sqlite-side-by-side.apk
          ls -lh /tmp/apk-out/player-from-10000-years-native-sqlite-side-by-side.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: player-from-10000-years-native-sqlite-side-by-side-apk
          path: /tmp/apk-out/player-from-10000-years-native-sqlite-side-by-side.apk
          if-no-files-found: error
          retention-days: 14
