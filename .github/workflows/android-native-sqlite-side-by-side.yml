name: Build Android APK - side by side install

on:
  workflow_dispatch:
  push:
    branches: [ "android-native-sqlite-build" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -name '*Native*SQLite*AndroidStudio*.zip' -print -quit)"
          test -n "$ZIP"
          rm -rf /tmp/android-src
          mkdir -p /tmp/android-src
          unzip -q "$ZIP" -d /tmp/android-src
          DIR="$(find /tmp/android-src -maxdepth 3 -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project: $DIR"

      - name: Install custom app icon
        shell: bash
        run: |
          set -euo pipefail
          test -f launcher.webp
          cp launcher.webp "$PROJECT_DIR/app/src/main/res/drawable/ic_launcher.webp"
          rm -f "$PROJECT_DIR/app/src/main/res/drawable/ic_launcher.xml"
          echo "Custom launcher icon installed."

      - name: Inject latest Excel master database
        shell: bash
        run: |
          set -euo pipefail
          test -f characters.generated.js
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          root = Path(os.environ["PROJECT_DIR"])
          candidates = list(root.rglob("*.html"))
          if not candidates:
              raise SystemExit("No HTML file found in extracted Android project")
          data = Path("characters.generated.js").read_text(encoding="utf-8").strip()
          if not data.startswith("const CHARACTERS = "):
              raise SystemExit("characters.generated.js has unexpected format")
          changed = []
          for p in candidates:
              s = p.read_text(encoding="utf-8")
              new, n = re.subn(r"const\s+CHARACTERS\s*=\s*\[.*?\];", data, s, count=1, flags=re.S)
              if n:
                  p.write_text(new, encoding="utf-8")
                  changed.append(str(p))
          if not changed:
              raise SystemExit("Could not find const CHARACTERS array in Android project")
          print("Injected master database into:")
          for p in changed:
              print(p)
          print("Character rows:", data.count('"name"'))
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check system Gradle
        shell: bash
        run: |
          set -euo pipefail
          command -v gradle
          gradle --version

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle wrapper --gradle-version 8.11 --distribution-type bin

      - name: Configure install-safe package and Android compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/build.gradle.kts"
          test -f "$FILE"
          sed -i 's/applicationId[[:space:]]*=[[:space:]]*"[^"]*"/applicationId = "com.playerfrom10000years.updated20260927v2"/' "$FILE"
          sed -i 's/versionCode[[:space:]]*=[[:space:]]*[0-9][0-9]*/versionCode = 100/' "$FILE" || true
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
          s = s.replace('jvmTarget = "11"', 'jvmTarget = "17"')
          if 'compileOptions {' not in s:
              marker = 'android {\n'
              block = ('    compileOptions {\n'
                       '        sourceCompatibility = JavaVersion.VERSION_17\n'
                       '        targetCompatibility = JavaVersion.VERSION_17\n'
                       '    }\n')
              s = s.replace(marker, marker + block, 1)
          else:
              s = s.replace('sourceCompatibility = JavaVersion.VERSION_1_8', 'sourceCompatibility = JavaVersion.VERSION_17')
              s = s.replace('targetCompatibility = JavaVersion.VERSION_1_8', 'targetCompatibility = JavaVersion.VERSION_17')
          # Ensure Android 10/API 29 can install the APK even if the source project omitted minSdk.
          if 'minSdk' not in s:
              marker = 'defaultConfig {\n'
              block = '        minSdk = 23\n'
              s = s.replace(marker, marker + block, 1)
          p.write_text(s)
          PY
          grep -nE 'applicationId|versionCode|minSdk|compileOptions|sourceCompatibility|targetCompatibility|jvmTarget' "$FILE" || true

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p /tmp/apk-out
          cp "$APK" /tmp/apk-out/player-from-10000-years-native-sqlite-updated-v2.apk
          ls -lh /tmp/apk-out/player-from-10000-years-native-sqlite-updated-v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: player-from-10000-years-native-sqlite-updated-v2-apk
          path: /tmp/apk-out/player-from-10000-years-native-sqlite-updated-v2.apk
          if-no-files-found: error
          retention-days: 14
