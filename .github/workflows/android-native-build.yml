name: Build Android APK (native SQLite history)

on:
  workflow_dispatch:
  push:
    branches: [ "android-native-sqlite-build" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Find Android project ZIP
        id: findzip
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -name '*Native*SQLite*AndroidStudio*.zip' -print -quit)"
          if [ -z "${ZIP}" ]; then
            ZIP="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"
          fi
          if [ -z "${ZIP}" ]; then
            echo 'No Android Studio ZIP found in the repository.'
            echo 'Upload the downloaded native SQLite Android Studio ZIP to this branch and commit it.'
            exit 1
          fi
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "Using ${ZIP}"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/android-src
          mkdir -p /tmp/android-src
          unzip -q "${{ steps.findzip.outputs.zip }}" -d /tmp/android-src
          PROJECT_DIR="$(find /tmp/android-src -maxdepth 3 -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "${PROJECT_DIR}" ]; then
            echo 'settings.gradle.kts not found after extraction.'
            exit 1
          fi
          echo "PROJECT_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"
          echo "Android project: ${PROJECT_DIR}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11'
          cache-provider: basic

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "${PROJECT_DIR}/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          if [ -z "${APK}" ]; then
            echo 'APK was not produced.'
            exit 1
          fi
          mkdir -p /tmp/apk-out
          cp "${APK}" /tmp/apk-out/player-from-10000-years-native-sqlite.apk
          ls -lh /tmp/apk-out/player-from-10000-years-native-sqlite.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: player-from-10000-years-native-sqlite-apk
          path: /tmp/apk-out/player-from-10000-years-native-sqlite.apk
          if-no-files-found: error
          retention-days: 14
