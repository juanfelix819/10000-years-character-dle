name: Build Android APK (native SQLite history)

on:
  workflow_dispatch:
  push:
    branches: [ "android-native-sqlite-build" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Find Android project ZIP
        id: findzip
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -name '*Native*SQLite*AndroidStudio*.zip' -print -quit)"
          if [ -z "${ZIP}" ]; then ZIP="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"; fi
          test -n "${ZIP}"
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/android-src
          mkdir -p /tmp/android-src
          unzip -q "${{ steps.findzip.outputs.zip }}" -d /tmp/android-src
          PROJECT_DIR="$(find /tmp/android-src -maxdepth 3 -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "${PROJECT_DIR}"
          echo "PROJECT_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11'
          cache-provider: basic

      - name: Make package unique and force Java/Kotlin 17
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/build.gradle.kts"
          sed -i 's/applicationId[[:space:]]*=[[:space:]]*"[^"]*"/applicationId = "com.playerfrom10000years.native"/' "$FILE"
          sed -i 's/versionCode[[:space:]]*=[[:space:]]*[0-9][0-9]*/versionCode = 2/' "$FILE" || true
          sed -i 's/jvmTarget[[:space:]]*=[[:space:]]*"[^"]*"/jvmTarget = "17"/g' "$FILE"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          if 'compileOptions {' not in s:
              s=s.replace('android {\n', 'android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n', 1)
          if 'tasks.withType<JavaCompile>' not in s:
              s += '\n\ntasks.withType<JavaCompile>().configureEach {\n    options.release.set(17)\n}\n'
          p.write_text(s)
          PY
          grep -nE 'applicationId|versionCode|compileOptions|sourceCompatibility|targetCompatibility|jvmTarget|JavaCompile|options.release' "$FILE" || true

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "${PROJECT_DIR}/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          test -n "${APK}"
          mkdir -p /tmp/apk-out
          cp "${APK}" /tmp/apk-out/player-from-10000-years-native-sqlite.apk
          ls -lh /tmp/apk-out/player-from-10000-years-native-sqlite.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: player-from-10000-years-native-sqlite-apk
          path: /tmp/apk-out/player-from-10000-years-native-sqlite.apk
          if-no-files-found: error
          retention-days: 14
