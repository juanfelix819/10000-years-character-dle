name: Build Android APK v4 (native SQLite history + custom logo)

on:
  workflow_dispatch:
  push:
    branches: [ "android-native-sqlite-build" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate and extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -name '*Native*SQLite*AndroidStudio*.zip' -print -quit)"
          test -n "$ZIP"
          rm -rf /tmp/android-src
          mkdir -p /tmp/android-src
          unzip -q "$ZIP" -d /tmp/android-src
          DIR="$(find /tmp/android-src -maxdepth 3 -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project: $DIR"

      - name: Install uploaded Player from 10000 Years logo
        shell: bash
        run: |
          set -euo pipefail
          test -f icon-512.png
          cp icon-512.png "$PROJECT_DIR/app/src/main/res/drawable/ic_launcher.png"
          rm -f "$PROJECT_DIR/app/src/main/res/drawable/ic_launcher.xml"
          echo "Uploaded logo installed as Android launcher icon."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Gradle
        shell: bash
        run: |
          set -euo pipefail
          command -v gradle
          gradle --version

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle wrapper --gradle-version 8.11 --distribution-type bin

      - name: Align Java and Kotlin JVM targets
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          marker = 'android {\n'
          addition = '''android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n'''
          if marker not in s:
              raise SystemExit('android block not found')
          s = s.replace(marker, addition, 1)
          p.write_text(s)
          print(p.read_text())
          PY

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p /tmp/apk-out
          cp "$APK" /tmp/apk-out/player-from-10000-years-native-sqlite.apk
          ls -lh /tmp/apk-out/player-from-10000-years-native-sqlite.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: player-from-10000-years-native-sqlite-apk
          path: /tmp/apk-out/player-from-10000-years-native-sqlite.apk
          if-no-files-found: error
          retention-days: 14
