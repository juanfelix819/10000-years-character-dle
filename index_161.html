<style>
:root{--bg:#0b0e13;--panel:#121722;--panel2:#181e2a;--text:#f5f7fa;--muted:#98a2b3;--line:#2a3342;--green:#16834a;--yellow:#c28b17;--red:#9f2d35;--blue:#4f46e5}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b0e13,#0e1219);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{max-width:1100px;margin:auto;padding:18px 12px 34px}.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
h1{font-size:22px;margin:0 0 5px}.sub{color:var(--muted);font-size:12px}
.controls{display:flex;gap:7px;flex-wrap:wrap}.btn,.select,input{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit}.btn{cursor:pointer}.btn.primary{background:var(--blue);border-color:#635bff}.btn.danger{background:#5b1e25}
.stats{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.pill{background:var(--panel);border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:12px}
.guessbar{position:sticky;top:0;z-index:5;background:rgba(11,14,19,.94);backdrop-filter:blur(10px);padding:10px 0}.search{position:relative;display:flex;gap:8px}.search input{flex:1;min-width:0}.suggestions{position:absolute;left:0;right:88px;top:48px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}.suggestions div{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}.suggestions div:last-child{border:0}.suggestions div:hover{background:#222a38}
.legend{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.legend span{font-size:11px;padding:5px 8px;border-radius:7px;background:var(--panel);border:1px solid var(--line)}
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.grid{min-width:850px}.row{display:grid;grid-template-columns:180px repeat(6,1fr);border-bottom:1px solid var(--line)}.row:last-child{border:0}.cell{min-height:72px;padding:8px;border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px}.cell:last-child{border:0}.head .cell{min-height:48px;background:#0f141c;color:#b8c0cd;font-weight:800}.namecell{justify-content:flex-start;text-align:left;background:#11161f;font-weight:750;font-size:12px}.namecell small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.green{background:rgba(22,131,74,.92)}.yellow{background:rgba(194,139,23,.92)}.red{background:rgba(159,45,53,.88)}.gray{background:rgba(75,85,99,.5)}.mark{display:block;font-size:21px;font-weight:900;margin-top:2px}.val{line-height:1.25;word-break:break-word}
.hint{margin:12px 0}.hintbox{padding:10px 12px;background:#17132a;border:1px dashed #6556a6;border-radius:10px;color:#ddd6fe;font-size:12px}
.empty{text-align:center;color:var(--muted);padding:38px 12px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.show{display:flex}.modalbox{width:min(720px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.modalbox h2{margin:0 0 12px}.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:8px;border-bottom:1px solid var(--line);text-align:left}.note{font-size:11px;color:var(--muted);line-height:1.45}.footer{text-align:center;color:#667085;font-size:10px;margin-top:18px}
@media(max-width:650px){.app{padding:14px 8px}.row{grid-template-columns:140px repeat(6,100px)}h1{font-size:19px}.search .btn{padding-left:13px;padding-right:13px}.suggestions{right:78px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>Player from 10,000 Years Guess Character Game</h1><div class="sub">Offline WhatPiece-style character deduction • <b id="count">0</b> characters</div></div>
    <div class="controls">
      <select id="difficulty" class="select">
        <option>Beginner</option><option>Easy</option><option>Medium</option><option>Hard</option><option>Expert</option><option>God Mode</option>
      </select>
      <button class="btn" onclick="showStats()">Statistics</button>
      <button class="btn" onclick="showHistory()">History</button>
      <button class="btn" onclick="backup()">Backup</button>
      <button class="btn" onclick="document.getElementById('restore').click()">Restore</button>
      <input id="restore" type="file" accept=".json" style="display:none" onchange="restore(event)">
    </div>
  </div>

  <div class="stats">
    <span class="pill">Wrong: <b id="wrong">0</b></span>
    <span class="pill">Guesses: <b id="guesses">0</b></span>
    <span class="pill">Hints: <b id="hints">0</b></span>
    <span class="pill">Score: <b id="score">1000</b></span>
  </div>

  <div class="guessbar">
    <div class="search">
      <input id="guess" autocomplete="off" placeholder="Type a character name…">
      <button class="btn primary" onclick="submitGuess()">Guess</button>
      <div id="suggestions" class="suggestions"></div>
    </div>
  </div>

  <div class="legend">
    <span class="green">✓ Exact</span><span class="yellow">~ Partial</span><span class="red">✗ Wrong</span>
    <span class="gray">? No data</span><span>↑ Later</span><span>↓ Earlier</span>
  </div>

  <div id="hint" class="hint"></div>
  <div class="gridwrap"><div id="grid" class="grid"></div></div>
  <div class="footer">Everything is stored locally on this device. No internet connection is required.</div>
</div>

<div id="modal" class="modal"><div class="modalbox">
  <h2 id="modalTitle"></h2><div id="modalBody"></div>
  <div class="modal-actions"><button class="btn primary" onclick="closeModal()">Close</button></div>
</div></div>

function norm(v){return String(v||"").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[’‘]/g,"'").replace(/[^a-z0-9\s\/,;|_-]/g,"").replace(/\s+/g," ").trim()}
function parts(v){return norm(v).split(/[\/,;|]+/).map(x=>x.trim()).filter(Boolean)}
function setOf(v){return new Set(parts(v))}
function exact(a,b){return norm(a)!=="" && norm(a)===norm(b)}
function partial(field,a,b){
  if(!a||!b)return false;
  const A=setOf(a),B=setOf(b);
  if(!A.size||!B.size)return false;
  if(field==="affiliation"||field==="location"||field==="race") {
    for(const x of A) for(const y of B) {
      if(x===y) return true;
      if(x.length>=4 && y.length>=4 && (x.includes(y)||y.includes(x))) return true;
    }
  }
  if(field==="status"||field==="gender") {
    return norm(a)===norm(b);
  }
  return false;
}
function compare(field,g,t){
  const gv=g[field],tv=t[field];
  if(!norm(gv)||!norm(tv)) return {kind:"gray",symbol:"?",value:gv||"No data"};
  if(exact(gv,tv)) return {kind:"green",symbol:"✓",value:gv};
  if(field==="arc"){
    const d=(t.arcOrder??-1)-(g.arcOrder??-1);
    if(d===0) return {kind:"green",symbol:"✓",value:gv};
    // Yellow means the guessed arc is immediately adjacent to the target arc.
    if(Math.abs(d)===1) return {kind:"yellow",symbol:d>0?"↑":"↓",value:gv};
    return {kind:"red",symbol:d>0?"↑":"↓",value:gv};
  }
  if(partial(field,gv,tv)) return {kind:"yellow",symbol:"~",value:gv};
  return {kind:"red",symbol:"✗",value:gv};
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function findCharacter(q){
  const n=norm(q);if(!n)return null;
  return CHARACTERS.find(c=>norm(c.name)===n)||CHARACTERS.find(c=>norm(c.name).includes(n)||n.includes(norm(c.name)));
}

  modalTitle.textContent=win?"Correct!":"Round finished";
  modalBody.innerHTML=win
    ?'<p>You found <b>'+esc(state.target.name)+'</b>.</p><p>Guesses: '+state.guesses.length+'<br>Wrong guesses: '+state.wrong+'<br>Hints: '+state.hints.length+'<br>Score: '+state.score+'</p>'
    :'<p>The answer was <b>'+esc(state.target.name)+'</b>.</p>';
  modalBody.innerHTML+='<div class="modal-actions"><button class="btn primary" onclick="closeModal();newRound()">New Round</button></div>';
  modal.classList.add("show");
}
function closeModal(){modal.classList.remove("show")}
function showStats(){
  const hist=JSON.parse(localStorage.getItem(STORE+"_history")||"[]");
  let h='<table class="table"><tr><th>Difficulty</th><th>Games</th><th>Win rate</th><th>Avg wrong</th><th>Avg hints</th><th>Avg score</th></tr>';
  ["Beginner","Easy","Medium","Hard","Expert","God Mode"].forEach(d=>{
    const a=hist.filter(x=>x.difficulty===d),wins=a.filter(x=>x.win).length;
    const avg=k=>a.length?(a.reduce((s,x)=>s+(Number(x[k])||0),0)/a.length).toFixed(1):"—";
    h+='<tr><td>'+d+'</td><td>'+a.length+'</td><td>'+(a.length?(wins/a.length*100).toFixed(0)+"%":"—")+'</td><td>'+avg("wrong")+'</td><td>'+avg("hints")+'</td><td>'+avg("score")+'</td></tr>';
  });
  h+='</table><p class="note">Statistics are saved locally. They survive closing and reopening this offline file unless browser/site data is cleared.</p><div class="modal-actions"><button class="btn danger" onclick="clearData()">Clear saved history</button></div>';
  modalTitle.textContent="Statistics";modalBody.innerHTML=h;modal.classList.add("show");
}
function showHistory(){
  const hist=JSON.parse(localStorage.getItem(STORE+"_history")||"[]");
  if(!hist.length){modalTitle.textContent="History";modalBody.innerHTML='<p class="note">No completed rounds yet.</p>';modal.classList.add("show");return}
  let h='<table class="table"><tr><th>Date</th><th>Character</th><th>Difficulty</th><th>Result</th><th>Wrong</th><th>Score</th></tr>';
  hist.slice(0,100).forEach(x=>{h+='<tr><td>'+new Date(x.date).toLocaleDateString()+'</td><td>'+esc(x.character)+'</td><td>'+esc(x.difficulty)+'</td><td>'+(x.win?"✓ Win":"✗ Loss")+'</td><td>'+x.wrong+'</td><td>'+x.score+'</td></tr>'});
  h+='</table>';modalTitle.textContent="History";modalBody.innerHTML=h;modal.classList.add("show");
}
function clearData(){
  if(confirm("Clear all saved history, statistics and recent-character data?")){
    localStorage.removeItem(STORE+"_history");localStorage.removeItem(STORE+"_recent");closeModal();
  }
}
function backup(){
  const payload={version:3,game:STORE,state,history:JSON.parse(localStorage.getItem(STORE+"_history")||"[]"),recent:recent()};
  const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="10000-years-character-dle-save.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function restore(e){
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>{
    try{
      const p=JSON.parse(rd.result);if(!p||!p.history)throw 0;
      localStorage.setItem(STORE+"_history",JSON.stringify(p.history.slice(0,1000)));
      localStorage.setItem(STORE+"_recent",JSON.stringify((p.recent||[]).slice(0,15)));
      if(p.state&&p.state.target&&CHARACTERS.some(c=>c.name===p.state.target.name)){state=p.state;state.difficulty=document.getElementById("difficulty").value;save()}
      render();alert("Save restored.");
    }catch(err){alert("That backup file is not valid.")}
  };rd.readAsText(f);e.target.value="";
}
guess.addEventListener("input",()=>{
  const q=norm(guess.value);suggestions.innerHTML="";if(!q)return;
  CHARACTERS.filter(c=>norm(c.name).includes(q)).slice(0,10).forEach(c=>{
    const d=document.createElement("div");d.textContent=c.name;d.onclick=()=>{guess.value=c.name;suggestions.innerHTML=""};suggestions.appendChild(d);
  });
});
guess.addEventListener("keydown",e=>{if(e.key==="Enter")submitGuess()});
difficulty.addEventListener("change",newRound);
count.textContent=CHARACTERS.length;
if(!load())newRound();else render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
